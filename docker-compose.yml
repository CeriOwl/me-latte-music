
services:
  postgres:
    image: postgres:17
    container_name: melatte-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: melatte
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: melatte-redis
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - redisdata:/data
    restart: unless-stopped
  me-latte-music-tunnel:
    container_name: me-latte-music-tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
